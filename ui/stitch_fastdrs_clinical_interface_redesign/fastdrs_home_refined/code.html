<header class="fixed top-0 w-full z-50 bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-on-surface-variant flex justify-between items-center px-edge-margin h-14">
<div class="flex items-center gap-4">

<h1 class="font-headline-sm-mobile md:font-headline-sm text-headline-sm-mobile md:text-headline-sm text-primary-container dark:text-primary-fixed-dim uppercase tracking-wider">fastDRS</h1>
</div>
<div class="hidden md:flex gap-6">
<a class="text-primary-container dark:text-primary-fixed font-label-md text-label-md hover:bg-surface-container-high transition-colors px-3 py-2 rounded" href="#">Home</a>
<a class="text-on-surface-variant dark:text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors px-3 py-2 rounded" href="#">History</a>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-edge-margin gap-xl max-w-4xl mx-auto w-full">
<!-- Primary Action -->
<div class="w-full max-w-md">
<button class="w-full bg-primary-container hover:bg-primary-container/90 text-on-primary font-headline-md text-headline-md rounded-xl py-6 px-8 shadow-sm hover:shadow-md transition-all flex flex-col items-center justify-center gap-sm group">
<span class="material-symbols-outlined text-4xl group-hover:scale-110 transition-transform" data-icon="add_circle">add_circle</span>
<span>Start New Screening</span>
</button>
</div>
<!-- Summary Cards Bento Grid -->
<div class="grid grid-cols-2 gap-md w-full max-w-md">
<!-- Today's Screenings -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center gap-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant text-center">Today's Screenings</h3>
<span class="font-display-lg text-display-lg text-primary-container">12</span>
</div>
<!-- Total Patients -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center gap-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant text-center">Total Patients</h3>
<span class="font-display-lg text-display-lg text-secondary">4,892</span>
</div>
</div>
</main>

<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 bg-surface dark:bg-inverse-surface border-t border-outline-variant dark:border-on-surface-variant flex justify-around items-center px-4 py-2 pb-safe">

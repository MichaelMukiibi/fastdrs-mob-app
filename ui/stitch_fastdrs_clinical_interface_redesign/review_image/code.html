<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-on-surface-variant flex justify-between items-center w-full px-edge-margin h-14 docked full-width top-0 z-50">

<span class="font-headline-sm text-headline-sm-mobile md:text-headline-sm text-primary dark:text-primary-fixed-dim uppercase tracking-wider font-bold">fastDRS</span>
</div>
<!-- Status indicator placeholder -->
<div class="flex items-center gap-xs text-on-surface-variant font-label-sm text-label-sm">
<span class="w-2 h-2 rounded-full bg-error"></span>

        </div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-start pt-md pb-xl px-edge-margin md:px-lg max-w-4xl mx-auto w-full gap-md">
<!-- Context Header -->
<div class="w-full flex justify-between items-end mb-sm">
<div>
<h1 class="font-headline-md-mobile md:font-headline-md text-headline-md-mobile md:text-headline-md text-on-surface">Image Review</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Patient ID: 893-A29 • Right Eye (OD)</p>
</div>
</div>

<div class="w-full max-w-2xl bg-black rounded-lg overflow-hidden relative inset-viewer group border border-outline-variant">

<span class="material-symbols-outlined" data-icon="fullscreen">fullscreen</span>
</button>
<!-- Image Quality Metrics Overlay (Subtle) -->
<div class="absolute bottom-sm left-sm bg-surface-container-highest/90 backdrop-blur-md px-sm py-xs rounded flex gap-sm items-center font-label-sm text-label-sm text-on-surface">
<span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]" data-icon="contrast">contrast</span> OK</span>
<span class="w-px h-3 bg-outline-variant"></span>
<span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]" data-icon="focus">center_focus_strong</span> Sharp</span>
</div>
</div>
<!-- Assessment Section -->
<div class="w-full max-w-2xl bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col items-center text-center gap-md mt-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Is this image suitable for screening?</h2>
<div class="flex flex-col sm:flex-row w-full gap-md mt-sm">
<button class="flex-1 flex items-center justify-center gap-sm bg-surface-container-high hover:bg-surface-variant text-on-surface font-label-md text-label-md py-sm px-md rounded-lg transition-colors border border-outline-variant min-h-[48px]">
